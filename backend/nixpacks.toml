# Nixpacks build config for Railway

[variables]
# Force npm to install devDependencies during build phase even when NODE_ENV=production
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund || npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
