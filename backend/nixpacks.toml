# Nixpacks build config for Railway
# Tells Railway how to install, build, and run the backend.
# Nixpacks handles Prisma + OpenSSL transparently.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund || npm install --no-audit --no-fund"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
