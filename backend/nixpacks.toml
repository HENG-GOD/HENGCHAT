# Nixpacks build config for Railway
#
# IMPORTANT: We inline `NODE_ENV=development` on install/build commands because
# Railway's service-level NODE_ENV=production env var overrides Nixpacks
# variables, which causes npm to skip devDependencies (including @nestjs/cli).
# Runtime still runs with NODE_ENV=production from the service env.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["NODE_ENV=development NPM_CONFIG_PRODUCTION=false npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = [
  "NODE_ENV=development npx prisma generate",
  "NODE_ENV=development npx nest build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
